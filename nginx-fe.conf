# 만들어진 정적 파일 서빙용 nginx 설정 파일 (be에선 nginx 가 java를 실행시켜 줌)
server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Vue Router history mode 대응:
    # 새로고침/직접 URL 접근 시 404 대신 index.html 반환
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 정적 자원 캐싱 (js/css/이미지)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}